<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="820px" height="480px" viewBox="-0.5 -0.5 820 480">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="820" height="480" fill="#ffffff" stroke="none"/>

  <!-- Title Banner -->
  <rect x="15" y="15" width="790" height="40" rx="6" ry="6" fill="#0f172a"/>
  <text x="410" y="40" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle">VoCall End-to-End Real-Time Voice AI Platform Architecture</text>

  <!-- Container: Real-Time Audio Streaming Loop -->
  <rect x="15" y="70" width="790" height="150" rx="8" ry="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="30" y="92" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold">REAL-TIME STREAMING LOOP (Target: &lt; 500ms E2E)</text>

  <!-- Block 1: User & WebRTC -->
  <rect x="30" y="105" width="130" height="95" rx="6" ry="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="95" y="130" fill="#0369a1" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">LiveKit SFU</text>
  <text x="95" y="148" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">WebRTC Transport</text>
  <text x="95" y="164" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Opus 48kHz Streams</text>
  <text x="95" y="180" fill="#0284c7" font-family="Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">RTT ~ 42ms</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 160 152 L 185 152" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Block 2: Silero VAD -->
  <rect x="190" y="105" width="130" height="95" rx="6" ry="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="255" y="130" fill="#047857" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Silero VAD</text>
  <text x="255" y="148" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Speech Boundary</text>
  <text x="255" y="164" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Barge-in Detection</text>
  <text x="255" y="180" fill="#059669" font-family="Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">Latency ~ 85ms</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 320 152 L 345 152" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Block 3: FastAPI Orchestration Core -->
  <rect x="350" y="105" width="150" height="95" rx="6" ry="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="425" y="127" fill="#4338ca" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">FastAPI Engine</text>
  <text x="425" y="143" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Async Pipeline Loop</text>
  <text x="425" y="157" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Task Cancellation</text>
  <text x="425" y="172" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">VA-ICECoT Intent</text>
  <text x="425" y="187" fill="#4f46e5" font-family="Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">Overhead &lt; 5ms</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 500 152 L 525 152" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Block 4: Groq LPU Inference -->
  <rect x="530" y="105" width="125" height="95" rx="6" ry="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="592" y="130" fill="#6d28d9" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Groq LPU</text>
  <text x="592" y="148" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Llama-3.3-70B</text>
  <text x="592" y="164" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Speculative Chunks</text>
  <text x="592" y="180" fill="#7c3aed" font-family="Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">TTFT ~ 165ms</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M 655 152 L 675 152" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Block 5: Acoustic TTS Synthesis -->
  <rect x="680" y="105" width="115" height="95" rx="6" ry="6" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
  <text x="737" y="130" fill="#be185d" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">Cartesia Sonic-2</text>
  <text x="737" y="148" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">State-Space Audio</text>
  <text x="737" y="164" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">Adaptive Prosody</text>
  <text x="737" y="180" fill="#db2777" font-family="Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">Latency ~ 78ms</text>

  <!-- Return Loop Arrow: TTS -> SFU -->
  <path d="M 737 200 L 737 212 L 95 212 L 95 200" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="416" y="210" fill="#0284c7" font-family="Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" text-anchor="middle">Synthesized Opus Audio Stream Egress (Total Mean E2E: 408ms)</text>

  <!-- Container: 4-Tier Cognitive Memory Subsystem (Bottom Left) -->
  <rect x="15" y="235" width="385" height="230" rx="8" ry="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="30" y="255" fill="#92400e" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold">4-TIER COGNITIVE MEMORY FANOUT (Bounded async t &lt;= 50ms)</text>

  <!-- Tier 1 -->
  <rect x="30" y="270" width="170" height="42" rx="5" ry="5" fill="#ffffff" stroke="#d97706"/>
  <text x="115" y="287" fill="#b45309" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">Tier 1: Upstash Redis</text>
  <text x="115" y="302" fill="#78350f" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">FIFO Turns (&lt; 8ms, &lt; 5 turns)</text>

  <!-- Tier 2 -->
  <rect x="215" y="270" width="170" height="42" rx="5" ry="5" fill="#ffffff" stroke="#d97706"/>
  <text x="300" y="287" fill="#b45309" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">Tier 2: Supabase pgvector</text>
  <text x="300" y="302" fill="#78350f" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">HNSW Cosine Recall (&lt; 30ms)</text>

  <!-- Tier 3 -->
  <rect x="30" y="325" width="170" height="42" rx="5" ry="5" fill="#ffffff" stroke="#d97706"/>
  <text x="115" y="342" fill="#b45309" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">Tier 3: PostgreSQL Relational</text>
  <text x="115" y="357" fill="#78350f" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">Session Logs &amp; Profile Recency</text>

  <!-- Tier 4 -->
  <rect x="215" y="325" width="170" height="42" rx="5" ry="5" fill="#ffffff" stroke="#d97706"/>
  <text x="300" y="342" fill="#b45309" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">Tier 4: FalkorDB Graph</text>
  <text x="300" y="357" fill="#78350f" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">2-Hop Cypher Entity Traversal</text>

  <!-- DPDP Erasure Box -->
  <rect x="30" y="380" width="355" height="40" rx="5" ry="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="207" y="396" fill="#991b1b" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">DPDP Act 2023 Cascading Memory Erasure</text>
  <text x="207" y="411" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">asyncio.gather(*deletions) + Dead-Letter Audit Queue</text>

  <!-- Arrow Memory Coordinator <-> FastAPI Core -->
  <path d="M 207 235 L 207 220 L 400 220 L 400 200" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Container: Dual-Signal Emotion Fusion Engine (Bottom Right) -->
  <rect x="420" y="235" width="385" height="230" rx="8" ry="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="435" y="255" fill="#9f1239" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold">DUAL-SIGNAL EMOTION FUSION ENGINE</text>

  <!-- Signal 1 -->
  <rect x="435" y="270" width="165" height="50" rx="5" ry="5" fill="#ffffff" stroke="#e11d48"/>
  <text x="517" y="289" fill="#be123c" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">Acoustic Prosody (Va)</text>
  <text x="517" y="303" fill="#881337" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">Hume 48-Dim Prosody Vector</text>
  <text x="517" y="314" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="8.5px" text-anchor="middle">Pitch, Energy, Spectral Tilt</text>

  <!-- Signal 2 -->
  <rect x="625" y="270" width="165" height="50" rx="5" ry="5" fill="#ffffff" stroke="#e11d48"/>
  <text x="707" y="289" fill="#be123c" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">Lexical Sentiment (Vt)</text>
  <text x="707" y="303" fill="#881337" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">Groq NLP Sentiment Extraction</text>
  <text x="707" y="314" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="8.5px" text-anchor="middle">Discrete Valence &amp; Arousal</text>

  <!-- Convex Combination Formula Box -->
  <rect x="435" y="335" width="355" height="42" rx="5" ry="5" fill="#ffffff" stroke="#e11d48"/>
  <text x="612" y="353" fill="#9f1239" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">V_fused = 0.60 * Va + 0.40 * Vt</text>
  <text x="612" y="368" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">Dynamic Convex Combination &amp; Calibration</text>

  <!-- TTS Modulation Output -->
  <rect x="435" y="390" width="355" height="40" rx="5" ry="5" fill="#ffffff" stroke="#e11d48"/>
  <text x="612" y="406" fill="#be123c" font-family="Helvetica, Arial, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle">Adaptive Voice Modulation Target</text>
  <text x="612" y="421" fill="#881337" font-family="Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">TTS Speed Rate (ρ) + Pitch Shift (ω) + Temperature (τ)</text>

  <!-- Arrow Emotion Engine -> TTS Block -->
  <path d="M 612 235 L 612 215 L 750 215 L 750 200" fill="none" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arr-rose)"/>
</svg>
